<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's MineCraft!</title>
    <link rel="icon" type="image/png" href="/Dirt_Path.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px 20px;
        }
        nav { text-align: center; margin-bottom: 30px; }
        nav a { margin: 0 15px; text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { color: #007bff; }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1e1e1e; /* 深色背景 */
                color: #e0e0e0;            /* 浅色文字 */
            }
            
            /* 如果你之前加了评论区白色背景容器，深色模式下也要改 */
            .comments {
                background: #2d2d2d;
                box-shadow: 0 1px 4px rgba(255,255,255,0.05);
            }
            
            /* 导航栏链接颜色调整 */
            nav a { color: #ccc; }
            nav a:hover { color: #fff; }
        }
      
        .content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        /* 评论区容器：限宽 + 居中 + 留白 */
        .comments {
            max-width: 800px;
            margin: 60px auto 0;
            padding: 24px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            text-align: left;
        }
        .comments h2 {
            font-size: 18px;
            margin-top: 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">首页</a>
        <!-- <a href="/about.html">关于我</a> -->
    </nav>

    <div class="content">
        <h1>👋 你好，这里是 Let's MineCraft！</h1>
        <p>这是官方主页，欢迎在下方留言。</p>
    </div>

    <!-- 评论区 -->
    <section class="comments">
        <h2>💬 评论区</h2>

        <!-- 👇 把 giscus.app 生成的完整 script 粘贴到这里 👇 -->
        <script src="https://giscus.app/client.js"
            data-repo="LetsMineCraft/LetsMineCraft.github.io"
            data-repo-id="R_kgDOV9vL3g"
            data-category="Announcements"
            data-category-id="DIC_kwDOV9vL3s4DMEzB"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="zh-CN"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
        </script>
        <!-- 👆 粘贴结束 👆 -->

    </section>
</body>
</html>
