<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's MineCraft!</title>
    <link rel="icon" type="image/png" href="/Dirt_Path.png">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333333; margin: 0; padding: 40px 20px; transition: background-color 0.3s, color 0.3s; }
        nav { text-align: center; margin-bottom: 30px; }
        nav a { margin: 0 15px; text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { color: #007bff; }
        .container { max-width: 800px; margin: 0 auto; }
        .content { text-align: center; margin-bottom: 40px; }

        .card { background: #ffffff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 30px; text-align: left; }
        .card h2 { font-size: 18px; margin-top: 0; padding-bottom: 12px; border-bottom: 1px solid #eeeeee; display: flex; justify-content: space-between; align-items: center; }
        .card h2 a { font-size: 14px; font-weight: normal; color: #007bff; text-decoration: none; }

        .discussion-list { display: flex; flex-direction: column; gap: 12px; }
        .discussion-item { display: block; padding: 12px 16px; background-color: #f8f9fa; border-radius: 6px; text-decoration: none; color: inherit; border: 1px solid transparent; transition: all 0.2s ease; }
        .discussion-item:hover { background-color: #e9ecef; border-color: #007bff; transform: translateX(4px); }
        .discussion-title { font-weight: bold; font-size: 16px; color: #24292f; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .discussion-meta { font-size: 13px; color: #656d76; }
        .loading-text, .empty-text { text-align: center; color: #656d76; padding: 20px; }

        /* 导航栏链接样式：使用 Flexbox 让图标和文字完美对齐 */
        nav a.nav-link {
            display: inline-flex;
            align-items: center;       /* 垂直居中 */
            gap: 6px;                  /* 图标和文字之间的间距 */
            text-decoration: none;
            color: #333;               /* 保持你原来的文字颜色 */
            font-weight: bold;
            margin: 0 15px;
        }
        nav a.nav-link:hover { color: #007bff; }
        
        /* 核心：控制 PNG 图标的样式 */
        .nav-icon {
            width: 20px;               /* 👈 调整图标大小（建议 16px - 24px 之间） */
            height: 20px;
            object-fit: cover;         /* 防止图片变形 */
            flex-shrink: 0;            /* 防止图标被挤压 */
        }
        
        @media (prefers-color-scheme: dark) {
            body { background-color: #1e1e1e; color: #e0e0e0; }
            nav a { color: #ccc; } nav a:hover { color: #fff; }
            .card { background: #2d2d2d; box-shadow: 0 1px 4px rgba(255,255,255,0.05); }
            .card h2 { border-bottom: 1px solid #444444; }
            .card h2 a { color: #58a6ff; }
            .discussion-item { background-color: #383838; }
            .discussion-item:hover { background-color: #444444; border-color: #58a6ff; }
            .discussion-title { color: #e0e0e0; }
            .discussion-meta { color: #a0a0a0; }
            .loading-text, .empty-text { color: #a0a0a0; }
            .nav-icon { filter: brightness(1.15); }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-link">
            <img src="/Dirt_Path.png" alt="" class="nav-icon">
            首页
        </a>
        <a href="/discussions.html">讨论大厅</a>
        <a href="/announcements.html">官方公告</a>
    </nav>

    <div class="container">
        <div class="content">
            <h1>👋 你好，这里是 Let's MineCraft！</h1>
            <p>这是官方主页，欢迎在下方留言或参与讨论。</p>
        </div>

        <section class="card">
            <h2>📢 近期公告 <a href="/announcements.html">查看全部 →</a></h2>
            <div id="latest-announcements" class="discussion-list"><p class="loading-text">正在加载...</p></div>
        </section>

        <section class="card">
            <h2>💬 最新讨论 <a href="/discussions.html">进入讨论大厅 →</a></h2>
            <div id="latest-discussions" class="discussion-list"><p class="loading-text">正在加载...</p></div>
        </section>

        <section class="card">
            <h2>📝 留言板</h2>
            <script src="https://giscus.app/client.js"
                    data-repo="LetsMineCraft/LetsMineCraft.github.io"
                    data-repo-id="R_kgDOV9vL3g"
                    data-category="General"
                    data-category-id="DIC_kwDOV9vL3s4DMEzC"
                    data-mapping="number" 
                    data-term="2" 
                    data-strict="0"
                    data-reactions-enabled="1"
                    data-emit-metadata="0"
                    data-input-position="bottom"
                    data-theme="preferred_color_scheme"
                    data-lang="zh-CN"
                    crossorigin="anonymous"
                    async>
            </script>
        </section>
    </div>

    <script>
        const owner = 'LetsMineCraft';
        const repo = 'LetsMineCraft.github.io';
        // 👇 这是通过 API 查到的你仓库 100% 真实的 ID 👇
        const annId = 'DIC_kwDOV9vL3s4DMEzB'; 
        const genId = 'DIC_kwDOV9vL3s4DMEzC'; 

        fetch(`https://api.github.com/repos/${owner}/${repo}/discussions?per_page=50`)
            .then(res => res.json())
            .then(allPosts => {
                // 前端精准过滤
                const announcements = allPosts.filter(post => post.category && post.category.node_id === annId).slice(0, 3);
                const discussions = allPosts.filter(post => post.category && post.category.node_id === genId).slice(0, 6);

                const annContainer = document.getElementById('latest-announcements');
                annContainer.innerHTML = announcements.length ? announcements.map(post => `
                    <a href="/post.html?number=${post.number}" class="discussion-item">
                        <div class="discussion-title">📌 ${post.title}</div>
                        <div class="discussion-meta">📅 ${new Date(post.created_at).toLocaleDateString('zh-CN')}</div>
                    </a>
                `).join('') : '<p class="empty-text">暂无公告</p>';

                const genContainer = document.getElementById('latest-discussions');
                genContainer.innerHTML = discussions.length ? discussions.map(post => `
                    <a href="/post.html?number=${post.number}" class="discussion-item">
                        <div class="discussion-title">${post.title}</div>
                        <div class="discussion-meta">👤 ${post.user ? post.user.login : '未知'} &nbsp;|&nbsp; 📅 ${new Date(post.created_at).toLocaleDateString('zh-CN')}</div>
                    </a>
                `).join('') : '<p class="empty-text">暂无讨论</p>';
            })
            .catch(() => {
                document.getElementById('latest-announcements').innerHTML = '<p class="empty-text">加载失败</p>';
                document.getElementById('latest-discussions').innerHTML = '<p class="empty-text">加载失败</p>';
            });
    </script>
</body>
</html>
