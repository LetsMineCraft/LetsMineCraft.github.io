<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's MineCraft!</title>
    <link rel="icon" type="image/png" href="/Dirt_Path.png">
        <style>
        /* ================= 1. 基础样式 (浅色模式默认) ================= */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333333;
            margin: 0;
            padding: 40px 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        
        nav { text-align: center; margin-bottom: 30px; }
        nav a { margin: 0 15px; text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { color: #007bff; }
      
        .content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        /* 评论区容器基础样式 */
        .comments {
            max-width: 800px;
            margin: 60px auto 0;
            padding: 24px;
            background: #ffffff; /* 浅色背景 */
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            text-align: left;
        }
        
        .comments h2 {
            font-size: 18px;
            margin-top: 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #eeeeee; /* 浅色边框 */
        }

        /* ================= 2. 深色模式覆盖样式 ================= */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1e1e1e;
                color: #e0e0e0;
            }
            
            nav a { color: #ccc; }
            nav a:hover { color: #fff; }

            /* 深色模式下的评论区外框 */
            .comments {
                background: #2d2d2d; /* 覆盖为深色背景 */
                box-shadow: 0 1px 4px rgba(255,255,255,0.05);
            }
            
            /* 深色模式下的标题边框 */
            .comments h2 {
                border-bottom: 1px solid #444444; /* 覆盖为深色边框，否则看不清 */
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">首页</a>
        <!-- <a href="/about.html">关于我</a> -->
    </nav>

    <div class="content">
        <h1>👋 你好，这里是 Let's MineCraft！</h1>
        <p>这是官方主页，欢迎在下方留言。</p>
    </div>

    <!-- 评论区 -->
    <section class="comments">
        <h2>💬 评论区</h2>

        <!-- 👇 把 giscus.app 生成的完整 script 粘贴到这里 👇 -->
        <script src="https://giscus.app/client.js"
            data-repo="LetsMineCraft/LetsMineCraft.github.io"
            data-repo-id="R_kgDOV9vL3g"
            data-category="Announcements"
            data-category-id="DIC_kwDOV9vL3s4DMEzB"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="zh-CN"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
        </script>
        <!-- 👆 粘贴结束 👆 -->

    </section>
</body>
</html>
